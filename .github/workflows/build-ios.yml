name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          cd ios

          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE" || {
            echo "No Xcode workspace found"
            exit 1
          }

          XCODE_LIST="$(xcodebuild -workspace "$WORKSPACE" -list)"
          SCHEMES="$(printf '%s\n' "$XCODE_LIST" |
            awk '/Schemes:/{flag=1; next} flag && /^[[:space:]]*$/ {exit} flag {gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print}')"

          APP_SCHEME="$(node -e 'try{const cfg=require("../app.json");process.stdout.write(cfg?.expo?.name ?? "")}catch(e){}')"
          if [ -n "$APP_SCHEME" ] && printf '%s\n' "$SCHEMES" | grep -Fxq "$APP_SCHEME"; then
            SCHEME="$APP_SCHEME"
          else
            SCHEME="$(printf '%s\n' "$SCHEMES" | awk 'NF {print; exit}')"
          fi

          test -n "$SCHEME" || {
            echo "No Xcode scheme found"
            exit 1
          }

          DERIVED_DATA_PATH="$PWD/build/DerivedData"
          BUILD_DIR="$PWD/build/Release-iphoneos"
          rm -rf "$BUILD_DIR" "$DERIVED_DATA_PATH"
          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"

          test -n "$APP_PATH" || {
            echo "No .app bundle found in $BUILD_DIR"
            find "$PWD/build" -maxdepth 5 -type d -name '*.app' -print
            exit 1
          }

          rm -rf "$BUILD_DIR/Payload"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"

          cd "$BUILD_DIR"
          zip -qry app.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: ios/build/Release-iphoneos/app.ipa
